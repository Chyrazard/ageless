# Reject unknown clear-text hosts without involving the application.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}

# Keep HTTP available for ACME renewal and redirect real visitors to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name agelessevo.com www.agelessevo.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://agelessevo.com$request_uri;
    }
}

# Reject TLS handshakes that do not name the Ageless domain (for example, raw-IP scans).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agelessevo.com www.agelessevo.com;

    root /var/www/ageless/current/public;
    server_tokens off;
    client_max_body_size 1m;

    ssl_certificate /etc/letsencrypt/live/agelessevo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agelessevo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/ageless-security-headers.conf;

    access_log /var/log/nginx/access.log combined;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) {
        return 405;
    }

    # The application has no PHP/CMS endpoints. These are unambiguously hostile probes.
    location ~* ^/(?:wp-admin(?:/|$)|wp-content(?:/|$)|wp-includes(?:/|$)|wp-json(?:/|$)|wp-login\.php$|xmlrpc\.php$|administrator(?:/|$)|joomla(?:/|$)|phpmyadmin(?:/|$)|pma(?:/|$)|vendor/phpunit(?:/|$)|cgi-bin(?:/|$)|actuator(?:/|$)|server-status$|HNAP1(?:/|$)|boaform(?:/|$)|\+CSCOE\+(?:/|$)) {
        access_log /var/log/nginx/security.log ageless_security;
        return 444;
    }

    location ~* \.(?:php[0-9]?|phtml)(?:/|$) {
        access_log /var/log/nginx/security.log ageless_security;
        return 444;
    }

    # Block hidden files and secret/config discovery while preserving ACME.
    location ~* /\.(?!well-known(?:/|$)) {
        access_log /var/log/nginx/security.log ageless_security;
        return 444;
    }

    location = /api/inquiries {
        limit_req zone=ageless_form burst=3 nodelay;
        limit_conn ageless_per_ip 5;
        client_max_body_size 32k;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ageless_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    location ^~ /_next/static/ {
        alias /var/www/ageless/current/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/ageless-security-headers.conf;
    }

    location ~* \.(?:woff2?|ttf)$ {
        try_files $uri @ageless;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800";
        include /etc/nginx/snippets/ageless-security-headers.conf;
    }

    location ~* \.(?:avif|webp|png|jpe?g|gif|svg|ico|mp4|webm|mov)$ {
        try_files $uri @ageless;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=604800";
        include /etc/nginx/snippets/ageless-security-headers.conf;
    }

    location ~* \.(?:css|js|mjs)$ {
        try_files $uri @ageless;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        include /etc/nginx/snippets/ageless-security-headers.conf;
    }

    location / {
        limit_req zone=ageless_dynamic burst=30 nodelay;
        limit_conn ageless_per_ip 20;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ageless_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    location @ageless {
        limit_req zone=ageless_dynamic burst=30 nodelay;
        limit_conn ageless_per_ip 20;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ageless_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }
}
