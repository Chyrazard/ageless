# Shared HTTP protections for the Ageless origin.

map $http_upgrade $ageless_connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=ageless_dynamic:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=ageless_form:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=ageless_per_ip:10m;

limit_req_status 429;
limit_conn_status 429;

client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 30s;
keepalive_timeout 15s;
reset_timedout_connection on;

log_format ageless_security '$remote_addr [$time_local] "$request" $status "$http_user_agent"';
